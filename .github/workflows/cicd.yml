name: CI/CD Pipeline - JOMO Backend (Kubernetes)

on:
  push:
    branches: [main, feature/scaling, feature/enhance-generation]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:      
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Docker image tag to deploy (e.g., main-abc123)'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  DOCKER_IMAGE: ai29/jomo-backend
  CONTAINER_NAME: jomo-backend

# OIDC: deploy jobs swap a short-lived GitHub token for the
# github-actions-jomo-deploy IAM role. No AWS keys are stored in GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  # Blocking gate: the suites that currently pass in full. A failure here stops
  # the image from being built or deployed. See docs/CAPSTONE-EVIDENCE.md for
  # the suites that are still broken and why they are not in the gate yet.
  test:
    name: Test gate
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'rollback'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test gate
        run: npm run test:gate
        env:
          NODE_ENV: test

  # Non-blocking: runs the whole suite and reports the pass/fail numbers on every
  # run, so the size of the remaining test debt stays visible.
  full-suite:
    name: Full test suite (report only)
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'rollback'
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full suite
        run: npx jest --ci --forceExit --maxWorkers=2 --json --outputFile=jest-results.json || true
        env:
          NODE_ENV: test

      - name: Summary
        run: |
          jq -r '"Suites: \(.numPassedTestSuites)/\(.numTotalTestSuites) passed | Tests: \(.numPassedTests)/\(.numTotalTests) passed"' jest-results.json | tee -a "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      environment: ${{ steps.check.outputs.environment }}
      image-tag: ${{ steps.check.outputs.image-tag }}
      namespace: ${{ steps.check.outputs.namespace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Check deployment conditions
        id: check
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image-tag=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "namespace=production" >> $GITHUB_OUTPUT

          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/feature/enhance-generation" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "image-tag=feature-enhance-generation-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT

          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/feature/scaling" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "image-tag=feature-scaling-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            [ -z "$IMAGE_TAG" ] && IMAGE_TAG="latest"
            echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
              echo "namespace=staging" >> $GITHUB_OUTPUT
            else
              echo "namespace=production" >> $GITHUB_OUTPUT
            fi

          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi
          
      # Runs the pinned Trivy image directly rather than a third-party action.
      # Blocks deploy on fixable CRITICAL findings; HIGH findings are reported
      # in the run summary but do not block.
      - name: Image scan (Trivy)
        run: |
          IMAGE="${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}"
          TRIVY="docker run --rm -v trivy-cache:/root/.cache aquasec/trivy:0.58.1 image --quiet --ignore-unfixed"
          {
            echo "### Trivy scan of \`$IMAGE\`"
            echo '```'
            $TRIVY --severity HIGH,CRITICAL --format table "$IMAGE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          $TRIVY --severity CRITICAL --exit-code 1 "$IMAGE"

  deploy:
    name: Deploy to Kubernetes (${{ needs.build-and-push.outputs.environment }})
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      needs.build-and-push.outputs.should-deploy == 'true' &&
      github.event.inputs.action != 'rollback'

    environment:
      name: ${{ needs.build-and-push.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name 4-jomo-cluster

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ needs.build-and-push.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update K8s Secret from GitHub Secrets
        run: |
          kubectl create secret generic jomo-backend-secrets \
            --namespace=${{ needs.build-and-push.outputs.namespace }} \
            --from-literal=FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            --from-literal=ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
            --from-literal=AWS_REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}" \
            --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
            --from-literal=LOG_LEVEL="${{ secrets.LOG_LEVEL || 'info' }}" \
            --from-literal=AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
            --from-literal=AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
            --from-literal=AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
            --from-literal=AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
            --from-literal=AUTH0_WEBHOOK_SECRET="${{ secrets.AUTH0_WEBHOOK_SECRET }}" \
            --from-literal=AUTH0_ACTIONS_SECRET="${{ secrets.AUTH0_ACTIONS_SECRET }}" \
            --from-literal=RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
            --from-literal=RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
            --from-literal=RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
            --from-literal=DEFAULT_USER_CREDITS="${{ secrets.DEFAULT_USER_CREDITS || '3' }}" \
            --from-literal=SUBSCRIPTION_RECONCILIATION_ENABLED="${{ secrets.SUBSCRIPTION_RECONCILIATION_ENABLED || 'true' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=IDEOGRAM_API_KEY="${{ secrets.IDEOGRAM_API_KEY }}" \
            --from-literal=FAL_KEY="${{ secrets.FAL_KEY }}" \
            --from-literal=IMAGEKIT_PUBLIC_KEY="${{ secrets.IMAGEKIT_PUBLIC_KEY }}" \
            --from-literal=IMAGEKIT_PRIVATE_KEY="${{ secrets.IMAGEKIT_PRIVATE_KEY }}" \
            --from-literal=IMAGEKIT_URL_ENDPOINT="${{ secrets.IMAGEKIT_URL_ENDPOINT }}" \
            --from-literal=SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal=N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}" \
            --from-literal=N8N_JWT_SECRET="${{ secrets.N8N_JWT_SECRET }}" \
            --from-literal=N8N_REQUEST_KEY="${{ secrets.N8N_REQUEST_KEY }}" \
            --from-literal=N8N_GENERATION_FLOW_ID="${{ secrets.N8N_GENERATION_FLOW_ID }}" \
            --from-literal=N8N_ENHANCEMENT_FLOW_ID="${{ secrets.N8N_ENHANCEMENT_FLOW_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: jomo-backend
            namespace: ${{ needs.build-and-push.outputs.namespace }}
            labels:
              app: jomo-backend
              environment: ${{ needs.build-and-push.outputs.environment }}
          spec:
            # No replicas field: the HPA owns the replica count, and setting it
            # here would reset the deployment to a fixed size on every release.
            selector:
              matchLabels:
                app: jomo-backend
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            template:
              metadata:
                labels:
                  app: jomo-backend
                  version: "${{ needs.build-and-push.outputs.image-tag }}"
              spec:
                containers:
                  - name: jomo-backend
                    image: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 3000
                    envFrom:
                      - secretRef:
                          name: jomo-backend-secrets
                    env:
                      - name: NODE_ENV
                        value: "${{ needs.build-and-push.outputs.environment }}"
                      - name: PORT
                        value: "3000"
                      # Surfaced by /health and the jomobit_app_info metric so
                      # the running version can be traced back to this commit.
                      - name: GIT_SHA
                        value: "${{ github.sha }}"
                      - name: IMAGE_TAG
                        value: "${{ needs.build-and-push.outputs.image-tag }}"
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 10
                    readinessProbe:
                      httpGet:
                        path: /ready
                        port: 3000
                      initialDelaySeconds: 10
                      periodSeconds: 5
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "250m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: jomo-backend-service
            namespace: ${{ needs.build-and-push.outputs.namespace }}
          spec:
            selector:
              app: jomo-backend
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
            type: ClusterIP
          EOF

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jomo-backend \
            --namespace=${{ needs.build-and-push.outputs.namespace }} \
            --timeout=300s

      - name: Apply autoscaling and network policy
        run: |
          kubectl apply -n ${{ needs.build-and-push.outputs.namespace }} -f k8s/hpa.yaml
          # Enforced by the VPC CNI network policy agent (enableNetworkPolicy in infra/cluster.yaml).
          kubectl apply -n ${{ needs.build-and-push.outputs.namespace }} -f k8s/network-policy.yaml

      - name: Apply ingress
        # Must happen in this job: the public smoke test below goes through it.
        # The /grafana and /prometheus backends are filled in by deploy-monitoring.
        run: |
          if [ "${{ needs.build-and-push.outputs.environment }}" == "production" ]; then
            kubectl apply -f k8s/production-ingress.yaml
          else
            kubectl apply -f k8s/staging-ingress.yaml
          fi

      - name: Smoke test - live version matches this commit
        run: |
          NS=${{ needs.build-and-push.outputs.namespace }}
          # Ask a running pod which build it is serving.
          LIVE_SHA=$(kubectl -n "$NS" exec deploy/jomo-backend -- \
            node -e "require('http').get('http://localhost:3000/health',r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>console.log(JSON.parse(b).version.gitSha))})")
          echo "expected: ${{ github.sha }}"
          echo "live:     $LIVE_SHA"
          [ "$LIVE_SHA" = "${{ github.sha }}" ] || { echo "::error::Deployed pod is not running this commit"; exit 1; }

      - name: Smoke test - public endpoint
        run: |
          if [ "${{ needs.build-and-push.outputs.environment }}" == "production" ]; then HOST=api.amritesh.dev; else HOST=api-dev.amritesh.dev; fi
          # Goes through DNS, TLS, the NLB and ingress-nginx, i.e. the path a real user takes.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOST/api" || true)
            [ "$code" = "200" ] && { echo "https://$HOST/api -> 200"; exit 0; }
            echo "attempt $i: got $code, retrying"; sleep 10
          done
          echo "::error::https://$HOST/api did not return 200"; exit 1

      - name: Verify deployment
        run: |
          echo "📊 Deployment status:"
          kubectl get pods -n ${{ needs.build-and-push.outputs.namespace }} -l app=jomo-backend
          echo ""
          echo "🌐 Service:"
          kubectl get svc -n ${{ needs.build-and-push.outputs.namespace }} jomo-backend-service

  deploy-monitoring:
    name: Deploy Monitoring Stack (${{ needs.build-and-push.outputs.environment }})
    runs-on: ubuntu-latest
    # Must list build-and-push explicitly: the `needs` context only exposes DIRECT
    # dependencies, so with `needs: deploy` alone every
    # needs.build-and-push.outputs.* below resolved to an empty string — which sent
    # production monitoring into the staging namespace.
    needs: [build-and-push, deploy]
    if: needs.build-and-push.outputs.should-deploy == 'true'

    # Needed for OIDC as well as approvals: the IAM role only trusts tokens
    # whose subject is repo:looper12349/jomobit-backend:environment:*.
    environment:
      name: ${{ needs.build-and-push.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name 4-jomo-cluster

      - name: Set monitoring namespace
        id: monitoring-ns
        run: |
          if [ "${{ needs.build-and-push.outputs.environment }}" == "production" ]; then
            echo "namespace=monitoring-prod" >> $GITHUB_OUTPUT
            echo "app-namespace=production" >> $GITHUB_OUTPUT
          else
            echo "namespace=monitoring-staging" >> $GITHUB_OUTPUT
            echo "app-namespace=staging" >> $GITHUB_OUTPUT
          fi

      - name: Install cert-manager (if not exists)
        run: |
          if ! kubectl get namespace cert-manager &> /dev/null; then
            echo "Installing cert-manager..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
            echo "Waiting for cert-manager to be ready..."
            kubectl wait --for=condition=available --timeout=180s deployment/cert-manager -n cert-manager
            kubectl wait --for=condition=available --timeout=180s deployment/cert-manager-webhook -n cert-manager
            sleep 10
          else
            echo "cert-manager already installed"
          fi

      - name: Create Let's Encrypt ClusterIssuer (if not exists)
        run: |
          if ! kubectl get clusterissuer letsencrypt-prod &> /dev/null; then
            echo "Creating Let's Encrypt ClusterIssuer..."
            kubectl apply -f k8s/cert-manager-issuer.yaml
            sleep 5
          else
            echo "ClusterIssuer already exists"
          fi

      - name: Create monitoring namespace
        run: |
          kubectl create namespace ${{ steps.monitoring-ns.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ steps.monitoring-ns.outputs.namespace }} environment=${{ needs.build-and-push.outputs.environment }} --overwrite

      - name: Setup Prometheus RBAC
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/prometheus-rbac.yaml | kubectl apply -f -

      - name: Create Grafana admin and Prometheus basic-auth secrets
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # No default password: fail rather than ship a guessable login.
          [ -n "$GRAFANA_ADMIN_PASSWORD" ] || { echo "::error::GRAFANA_ADMIN_PASSWORD secret is not set"; exit 1; }
          kubectl create secret generic grafana-secrets \
            --namespace=${{ steps.monitoring-ns.outputs.namespace }} \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          # htpasswd entry for the /prometheus Ingress (user: admin).
          kubectl create secret generic prometheus-basic-auth \
            --namespace=${{ steps.monitoring-ns.outputs.app-namespace }} \
            --from-literal=auth="admin:$(openssl passwd -apr1 "$GRAFANA_ADMIN_PASSWORD")" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Prometheus PVC
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/prometheus-pvc.yaml | kubectl apply -f -

      - name: Deploy Grafana PVC
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/grafana-pvc.yaml | kubectl apply -f -

      - name: Update Prometheus config for environment
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-config
            namespace: ${{ steps.monitoring-ns.outputs.namespace }}
          data:
            prometheus.yml: |
              global:
                scrape_interval: 15s
                evaluation_interval: 15s
              
              rule_files:
                - '/etc/prometheus/rules/*.yml'
              
              scrape_configs:
                - job_name: 'jomo-backend-${{ needs.build-and-push.outputs.environment }}'
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names:
                          - ${{ steps.monitoring-ns.outputs.app-namespace }}
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_label_app]
                      action: keep
                      regex: jomo-backend
                    - source_labels: [__meta_kubernetes_pod_ip]
                      target_label: __address__
                      replacement: '\${1}:3000'
                    - source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: pod

                # Kubernetes object state: deployment/HPA replica counts, pod
                # restarts, container status.
                - job_name: 'kube-state-metrics'
                  static_configs:
                    - targets: ['kube-state-metrics:8080']
          EOF

      - name: Deploy kube-state-metrics
        # Scraped by the 'kube-state-metrics' job in the Prometheus config above
        # (HPA replica counts, pod restarts).
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/kube-state-metrics.yaml | kubectl apply -f -

      - name: Deploy Prometheus alerts
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/prometheus-alerts.yaml | kubectl apply -f -

      - name: Deploy Prometheus
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/prometheus-deployment.yaml | kubectl apply -f -

      - name: Deploy Grafana datasource
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/grafana-datasource.yaml | kubectl apply -f -

      - name: Deploy Grafana dashboards
        # MUST run before "Deploy Grafana": the deployment mounts the
        # grafana-dashboard-provider and grafana-dashboards ConfigMaps, and the pod
        # will not start if they are missing.
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/grafana-dashboards.yaml | kubectl apply -f -

      - name: Deploy Grafana
        run: |
          sed "s/namespace: monitoring/namespace: ${{ steps.monitoring-ns.outputs.namespace }}/g" k8s/monitoring/grafana-deployment.yaml | kubectl apply -f -

      - name: Create ExternalName services in app namespace
        run: |
          if [ "${{ needs.build-and-push.outputs.environment }}" == "production" ]; then
            kubectl apply -f k8s/production-monitoring-services.yaml
          else
            kubectl apply -f k8s/staging-monitoring-services.yaml
          fi

      - name: Wait for monitoring stack
        run: |
          echo "⏳ Waiting for Prometheus..."
          kubectl wait --for=condition=available --timeout=180s \
            deployment/prometheus -n ${{ steps.monitoring-ns.outputs.namespace }} || echo "⚠️ Prometheus deployment timeout"
          
          echo "⏳ Waiting for Grafana..."
          kubectl wait --for=condition=available --timeout=180s \
            deployment/grafana -n ${{ steps.monitoring-ns.outputs.namespace }} || echo "⚠️ Grafana deployment timeout"

      - name: Get monitoring access info
        run: |
          echo "📊 Monitoring Stack Status (${{ needs.build-and-push.outputs.environment }}):"
          echo "================================"
          echo "Environment: ${{ needs.build-and-push.outputs.environment }}"
          echo "App Namespace: ${{ steps.monitoring-ns.outputs.app-namespace }}"
          echo "Monitoring Namespace: ${{ steps.monitoring-ns.outputs.namespace }}"
          echo ""
          kubectl get pods -n ${{ steps.monitoring-ns.outputs.namespace }}
          echo ""
          echo "🌐 Services:"
          kubectl get svc -n ${{ steps.monitoring-ns.outputs.namespace }}
          echo ""
          echo "📈 Monitoring Access:"
          if [ "${{ needs.build-and-push.outputs.environment }}" == "production" ]; then
            echo "Application:  https://api.amritesh.dev/api"
            echo "Grafana:      https://api.amritesh.dev/grafana/"
            echo "Prometheus:   https://api.amritesh.dev/prometheus/"
          else
            echo "Application:  https://api-dev.amritesh.dev/api"
            echo "Grafana:      https://api-dev.amritesh.dev/grafana/"
            echo "Prometheus:   https://api-dev.amritesh.dev/prometheus/"
          fi
          echo ""
          echo "🔍 Ingress Status:"
          kubectl get ingress -n ${{ steps.monitoring-ns.outputs.app-namespace }}
          echo ""
          echo "🔐 SSL Certificate Status:"
          kubectl get certificate -n ${{ steps.monitoring-ns.outputs.app-namespace }}

  rollback:
    name: Rollback Kubernetes Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name 4-jomo-cluster

      - name: Rollback deployment
        run: |
          NAMESPACE=${{ github.event.inputs.environment == 'staging' && 'staging' || 'production' }}
          kubectl rollout undo deployment/jomo-backend --namespace=${NAMESPACE}
          kubectl rollout status deployment/jomo-backend --namespace=${NAMESPACE} --timeout=300s