apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If you have cert-manager
spec:
  ingressClassName: nginx  # Use ingressClassName instead of annotation
  tls:
    - hosts:
        - api.amritesh.dev
      secretName: monitoring-prod-tls
  rules:
    - host: api.amritesh.dev
      http:
        paths:
          # Grafana Production
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          
          # Prometheus Production (optional - usually kept internal)
          - path: /prometheus(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
