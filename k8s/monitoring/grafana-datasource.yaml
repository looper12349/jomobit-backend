apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # Must be 'prometheus': jomobit-overview.json pins its panels to this uid.
        uid: prometheus
        access: proxy
        # Prometheus runs with --web.route-prefix=/prometheus, so its API
        # lives at /prometheus/api/v1/... — the prefix must be in this URL.
        url: http://prometheus:9090/prometheus
        isDefault: true
        editable: true
