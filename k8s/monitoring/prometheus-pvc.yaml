apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName will use the default storage class if not specified
  # Uncomment and set if you need a specific storage class:
  # storageClassName: gp2  # For AWS EBS
  # storageClassName: gp3  # For AWS EBS gp3
  # storageClassName: standard  # For GKE
