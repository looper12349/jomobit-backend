apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-combined-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
  - host: api-dev.amritesh.dev
    http:
      paths:
      # App paths (your backend)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jomo-backend-service
            port:
              number: 80
      
      # Monitoring paths
      - path: /grafana(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: grafana
            namespace: monitoring-staging
            port:
              number: 3000
      
      - path: /prometheus(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: prometheus
            namespace: monitoring-staging
            port:
              number: 9090
---
# Add rewrite annotation for monitoring paths
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: staging
spec:
  type: ExternalName
  externalName: grafana.monitoring-staging.svc.cluster.local
  ports:
  - port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: staging
spec:
  type: ExternalName
  externalName: prometheus.monitoring-staging.svc.cluster.local
  ports:
  - port: 9090
