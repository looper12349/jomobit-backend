apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jomo-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jomo-backend
  minReplicas: 2
  # 2 x t3a.small nodes: four ~256Mi pods is the ceiling that still leaves
  # room for the monitoring stack.
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
