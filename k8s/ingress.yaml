apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jomo-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx" # Adjust based on the actual ingress controller (e.g., alb for AWS)
    nginx.ingress.kubernetes.io/limit-rps: "50" # Basic rate limiting
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Example AWS ALB Annotations:
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - host: api.jomo.dazzeldigital.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jomo-backend-service
            port:
              number: 80
