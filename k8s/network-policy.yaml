apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jomo-backend-network-policy
spec:
  podSelector:
    matchLabels:
      app: jomo-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Traffic from the ingress controller only. kubernetes.io/metadata.name is set
  # automatically on every namespace; the old `name:` label did not exist, so
  # the previous selector matched nothing.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  # Prometheus scraping /metrics from the monitoring namespaces.
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [monitoring-staging, monitoring-prod]
    ports:
    - protocol: TCP
      port: 3000
  # Pods in the same namespace (in-cluster k6 load test, smoke checks).
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0 # Allows all outbound traffic for external API calls (Auth0, OpenAI, MongoDB Atlas, etc.)
