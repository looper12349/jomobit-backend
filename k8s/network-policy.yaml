apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jomo-backend-network-policy
spec:
  podSelector:
    matchLabels:
      app: jomo-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx # Allow traffic only from ingress controller. Adjust namespace label as needed.
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0 # Allows all outbound traffic for external API calls (Auth0, OpenAI, MongoDB Atlas, etc.)
