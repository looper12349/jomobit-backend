apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: production
spec:
  type: ExternalName
  externalName: grafana.monitoring-prod.svc.cluster.local
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: production
spec:
  type: ExternalName
  externalName: prometheus.monitoring-prod.svc.cluster.local
  ports:
    - port: 9090
      targetPort: 9090
