groups:
  - name: jomobit-api-alerts
    interval: 15s
    rules:
      - alert: JomobitHigh5xxErrorRate
        expr: |
          (
            sum(rate(jomobit_http_requests_total{status_code=~"5.."}[1m]))
            /
            clamp_min(sum(rate(jomobit_http_requests_total[1m])), 1)
          ) > 0.05
        for: 45s
        labels:
          severity: critical
          service: jomobit-backend-api
        annotations:
          summary: "High 5xx error rate"
          description: "5xx responses exceeded 5% for at least 45 seconds."

      - alert: JomobitP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(jomobit_http_request_duration_seconds_bucket[1m]))
          ) > 1.5
        for: 45s
        labels:
          severity: warning
          service: jomobit-backend-api
        annotations:
          summary: "P95 latency is high"
          description: "P95 request latency has exceeded 1.5 seconds for 45 seconds."

      - alert: JomobitServiceDown
        expr: up{job="jomobit-backend"} == 0
        for: 45s
        labels:
          severity: critical
          service: jomobit-backend-api
        annotations:
          summary: "Jomobit backend is down"
          description: "Prometheus cannot scrape the backend /metrics endpoint."

      - alert: JomobitHostMemoryPressure
        expr: |
          (
            node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
          ) / node_memory_MemTotal_bytes > 0.9
        for: 45s
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Host memory usage above 90%"
          description: "Node memory pressure is high for 45 seconds."
