server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off;

  # API app at root
  location / {
    set $app_upstream app:3000;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Grafana under /grafana/
  location /grafana/api/live/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 3000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
  }

  location /grafana/ {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 3000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Prometheus under /prometheus/
  location /prometheus/ {
    set $prometheus_upstream prometheus:9090;
    proxy_pass http://$prometheus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Alertmanager under /alertmanager/
  location /alertmanager/ {
    set $alertmanager_upstream alertmanager:9093;
    proxy_pass http://$alertmanager_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Loki API under /loki/
  location /loki/ {
    rewrite ^/loki/(.*)$ /$1 break;
    set $loki_upstream loki:3100;
    proxy_pass http://$loki_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Node exporter metrics under /node-exporter/metrics
  location = /node-exporter/metrics {
    set $node_exporter_upstream node-exporter:9100;
    proxy_pass http://$node_exporter_upstream/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # cAdvisor UI under /cadvisor/
  location /cadvisor/ {
    rewrite ^/cadvisor/(.*)$ /$1 break;
    set $cadvisor_upstream cadvisor:8080;
    proxy_pass http://$cadvisor_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
