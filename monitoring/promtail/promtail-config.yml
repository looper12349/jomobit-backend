server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: job
      - target_label: __path__
        replacement: /var/lib/docker/containers/*/*-json.log

  - job_name: jomobit-app-logs
    static_configs:
      - targets: ['localhost']
        labels:
          job: jomobit-app-file-logs
          service: jomobit-backend-api
          __path__: /var/log/jomobit/*.log

  - job_name: deployment-history
    static_configs:
      - targets: ['localhost']
        labels:
          job: jomobit-deployment-history
          service: jomobit-backend-api
          __path__: /var/log/jomobit-deployments/deployment-history.jsonl
